server {
    listen 8080;
    root /usr/share/nginx/html;

    # Forward API calls to the backend container (no CORS needed).
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    # Single-page app: unknown paths load index.html and React Router takes over.
    location / {
        try_files $uri /index.html;
    }
}
